<!-- usuarios.html -->
<header class="encabezado">
  <div>
    <h1>👥 Usuarios</h1>
    <p class="subtitulo">Crea cuentas y asigna roles. Las contraseñas se guardan cifradas (bcrypt).</p>
  </div>
</header>

@if (error()) {
  <div class="aviso aviso-error">{{ error() }}</div>
}
@if (exito()) {
  <div class="aviso aviso-ok">{{ exito() }}</div>
}

<form class="formulario tarjeta" [formGroup]="formulario" (ngSubmit)="crear()" style="margin-bottom: 16px">
  <h2>Nuevo usuario</h2>
  <div class="rejilla">
    <label class="campo"><span>Nombre</span><input formControlName="nombre" /></label>
    <label class="campo"><span>Correo</span><input type="email" formControlName="correo" /></label>
    <label class="campo"><span>Contraseña (mín. 8)</span><input type="password" formControlName="contrasena" /></label>
    <label class="campo">
      <span>Rol</span>
      <select formControlName="rol">
        @for (r of roles; track r) {
          <option [value]="r">{{ etiqueta(r) }}</option>
        }
      </select>
    </label>
  </div>
  <div><button class="btn btn-primario" type="submit" [disabled]="formulario.invalid">Crear usuario</button></div>
</form>

<div class="tarjeta tabla-scroll">
  <table>
    <thead>
      <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr>
    </thead>
    <tbody>
      @for (u of usuarios(); track u._id) {
        <tr>
          <td>{{ u.nombre }}</td>
          <td>{{ u.correo }}</td>
          <td>
            <!-- $any($event.target).value: lee el valor elegido del <select> -->
            <select [value]="u.rol" (change)="cambiarRol(u, $any($event.target).value)">
              @for (r of roles; track r) {
                <option [value]="r">{{ etiqueta(r) }}</option>
              }
            </select>
          </td>
          <td>
            <button class="btn btn-chico" [class.btn-peligro]="u.activo" (click)="alternarActivo(u)">
              {{ u.activo ? 'Desactivar' : 'Activar' }}
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
